[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "netwatch"
version = "0.8.0"
description = "Self-hosted network diagnostics and root-cause analysis"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.14,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "icmplib>=3.0.4,<4.0",
    "dnspython>=2.7,<3.0",
    "httpx>=0.28,<1.0",
    "prometheus-client>=0.21,<1.0",
    "netaddr>=1.3,<2.0",  # offline IEEE OUI registry for device vendors
    "tzdata>=2024.1",  # zoneinfo data for the auto-update window (slim images lack it)
    "cryptography>=44,<51",  # encrypts the stored Deco password
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["netwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S104",  # binding to 0.0.0.0 is intentional and configurable
    "S311",  # random is used for scheduling jitter, not cryptography
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"netwatch/migrations/**" = ["E501"]
