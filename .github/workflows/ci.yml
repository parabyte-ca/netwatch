name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: shellcheck -x setup.sh update.sh scripts/*.sh

  image:
    needs: [backend, frontend, scripts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless image signing (Sigstore)
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A push to main whose VERSION has no git tag yet is a release: bumping VERSION (with its
      # CHANGELOG section) in a PR and merging it is all it takes. Pushing a tag by hand still
      # works and is treated the same way.
      - name: Read version and decide whether this is a release
        id: version
        run: |
          VERSION="$(cat VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be X.Y.Z"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          RELEASE=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($VERSION)"
              exit 1
            fi
            RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION already released; publishing :latest only."
            else
              echo "VERSION $VERSION has no tag yet: this push is the v$VERSION release."
              RELEASE=true
            fi
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/parabyte-ca/netwatch
          tags: |
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build for smoke test
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: netwatch:ci
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha

      - name: Smoke-test the image (mtr, iperf3, hardened start)
        run: scripts/ci-image-smoke.sh netwatch:ci

      - name: Build (and push on main / tags)
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless signature tied to this workflow's GitHub identity. update.sh on TrueNAS checks
      # it (and that the release tag is the commit the image was built from) before deploying.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: github.event_name != 'pull_request'
      - name: Sign the image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/parabyte-ca/netwatch@${DIGEST}"

  # Publishing the GitHub Release (only after the versioned image is pushed) is what makes a
  # version visible to NetWatch's in-app update check, so a release never points at an image
  # that doesn't exist. For an automatic release, `gh release create --target` also creates the
  # git tag. If this job fails, the next push to main retries it (the tag is still missing).
  release:
    needs: image
    if: needs.image.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.image.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::No CHANGELOG.md section for $VERSION"
            exit 1
          fi
          cat notes.md
      - name: Create GitHub release (and tag)
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "NetWatch v$VERSION" --notes-file notes.md
