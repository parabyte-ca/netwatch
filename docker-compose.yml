name: netwatch

services:
  netwatch:
    image: ghcr.io/parabyte-ca/netwatch:latest
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    container_name: netwatch
    restart: unless-stopped

    # Host networking is required for ARP, mDNS, SSDP and for probing from the host's real
    # interface. The web UI listens on NETWATCH_PORT (default 8090) directly on the host.
    network_mode: host

    # Least privilege: drop everything, add back only raw sockets (ICMP, packet capture) and
    # network administration (interface statistics). No privilege escalation, read-only root.
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=64m

    env_file:
      - path: .env
        required: false
    environment:
      NETWATCH_DATA_DIR: /data
      NETWATCH_UPGRADE_DIR: /upgrade
      NETWATCH_UPGRADE_STATUS_DIR: /upgrade-status

    volumes:
      - ./data:/data
      # In-app updates: requests go to the host-side upgrade agent (scripts/upgrade-agent.sh)
      # through upgrade/; its replies come back read-only, so the container cannot tamper with
      # anything the agent (root on the host) reads or writes.
      - ./upgrade:/upgrade
      - ./upgrade-status:/upgrade-status:ro

    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-m", "netwatch.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
